<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Powerscaling Database</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- Roster View -->
      <div id="roster-view">
        <header>
          <h1>Powerscaling Database</h1>
        </header>
        <form>
          <input
            type="text"
            id="searchbar"
            placeholder="Search by character name, tier, or tags..."
          />
        </form>
        <div id="character-grid" class="grid"></div>
      </div>

      <!-- Profile View -->
      <div id="profile-view" class="hidden">
        <button class="back-btn" onclick="showRoster()">
          ← Back to Roster
        </button>
        <div id="profile-content"></div>
      </div>
    </div>
  </body>
</html>
